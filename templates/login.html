<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('log_titre') }} - SIDAC | BEAC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #0E2A47;
        }

        .fond {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('/static/fond_login.svg') no-repeat center center;
            background-size: 100% 100%;
            transition: filter 0.8s ease;
            z-index: -1;
        }
        /* Fenêtre étroite/haute : on recadre au lieu d'étirer (le bâtiment reste net) */
        @media (max-aspect-ratio: 5/4) {
            .fond { background-size: cover; }
        }

        .fond.flou {
            filter: blur(8px) brightness(0.7);
        }

        /* ========== ÉCRAN 1 : ACCUEIL ========== */
        .ecran-accueil {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8vh;
            transition: opacity 0.6s ease;
        }

        .ecran-accueil.cache { opacity: 0; pointer-events: none; }

        .accueil-panel {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 14px 34px;
            background: rgba(6,18,38,0.18);
            -webkit-backdrop-filter: blur(1.5px); backdrop-filter: blur(1.5px);
            border-radius: 18px;
        }
        .accueil-panel .nom-appli { margin-bottom: 0; }
        .accueil-slogan {
            color: rgba(255,255,255,0.9); font-size: 13px; letter-spacing: 1px;
            text-align: center; max-width: 360px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .nom-appli {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 28px;
        }

        .plateforme {
            color: white;
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 5px;
            text-shadow: 0 3px 12px rgba(0,0,0,0.8);
        }

        .sigle {
            color: #E8C547;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 8px;
            font-family: Georgia, 'Times New Roman', serif;
            text-shadow: 0 3px 15px rgba(0,0,0,0.9);
        }

        .btn-acceder {
            padding: 15px 45px;
            background: linear-gradient(135deg, #C9A227, #E8C547);
            color: #1A1A1A;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 6px 25px rgba(0,0,0,0.4);
        }

        .btn-acceder:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(201,162,39,0.6);
        }

        /* ========== ÉCRAN 2 : CONNEXION ========== */
        .ecran-login {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease 0.3s;
            overflow-y: auto;
            padding: 20px;
        }

        .ecran-login.visible { opacity: 1; pointer-events: all; }

        .btn-retour {
            position: fixed;
            top: 22px;
            left: 25px;
            padding: 9px 20px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        .btn-retour:hover {
            background: rgba(255,255,255,0.25);
            transform: translateX(-3px);
        }

        .card {
            width: 100%;
            max-width: 400px;
            max-height: 92vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(201,162,39,0.4);
            border-radius: 24px;
            padding: 28px 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .card-logo { width: 68px; margin-bottom: 8px; }

        .card-titre {
            color: white;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 10px;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .card-sous-titre {
            color: rgba(255,255,255,0.75);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.7);
            text-align: center;
        }

        .onglets-role {
            display: flex;
            width: 100%;
            background: rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 18px;
        }

        .onglet {
            flex: 1;
            padding: 10px;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            user-select: none;
        }

        .onglet.actif {
            background: linear-gradient(135deg, #C9A227, #E8C547);
            color: #1A1A1A;
        }

        .form-group { width: 100%; margin-bottom: 15px; }
        .input-wrapper { position: relative; width: 100%; }

        input {
            width: 100%;
            padding: 13px 45px 13px 16px;
            background: rgba(255,255,255,0.88);
            border: 1px solid rgba(201,162,39,0.5);
            border-radius: 10px;
            color: #1A1A2E;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input::placeholder { color: rgba(26,26,46,0.5); }
        input:focus {
            border-color: #C9A227;
            background: white;
            box-shadow: 0 0 0 3px rgba(201,162,39,0.2);
        }

        .toggle-mdp {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }
        .toggle-mdp:hover { opacity: 1; }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #C9A227, #E8C547);
            color: #1A1A1A;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 6px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(201,162,39,0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201,162,39,0.6);
        }

        .erreur {
            color: #ffb3b3;
            font-size: 12px;
            margin-bottom: 14px;
            text-align: center;
            background: rgba(180,30,30,0.5);
            border: 1px solid rgba(255,80,80,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            width: 100%;
        }

        .succes {
            color: #b8f5c0;
            font-size: 12px;
            margin-bottom: 14px;
            text-align: center;
            background: rgba(30,140,60,0.5);
            border: 1px solid rgba(80,220,120,0.4);
            padding: 8px 15px;
            border-radius: 8px;
            width: 100%;
        }

        .links {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            text-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }

        .links a { color: #E8C547; font-weight: 700; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .mdp-oublie { margin-top: 8px; font-size: 12px; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 500px) {
            .nom-appli { flex-direction: column; align-items: center; gap: 4px; }
            .plateforme { font-size: 20px; }
            .sigle { font-size: 32px; }
            .card { padding: 22px 20px; }
            .card-titre { font-size: 22px; letter-spacing: 7px; }
        }

        @media (max-height: 550px) {
            .ecran-accueil { padding-bottom: 4vh; }
            .nom-appli { margin-bottom: 14px; }
            .btn-acceder { padding: 11px 32px; font-size: 13px; }
            .card { padding: 16px 24px; }
            .card-logo { width: 48px; }
            .card-titre { font-size: 20px; margin-bottom: 2px; }
            .card-sous-titre { margin-bottom: 8px; }
            .form-group { margin-bottom: 10px; }
        }

        /* Sélecteur de langue : visible sur l'accueil comme sur la connexion,
           pour que l'agent choisisse sa langue AVANT de se connecter. */
        .choix-langue {
            position: fixed;
            top: 22px; right: 26px;
            z-index: 50;
            display: flex; align-items: center; gap: 4px;
            background: rgba(255,255,255,0.14);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 22px;
            padding: 5px 7px;
        }
        .choix-langue a {
            color: rgba(255,255,255,0.82);
            text-decoration: none;
            font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
            padding: 5px 11px; border-radius: 16px;
            transition: background 0.2s, color 0.2s;
        }
        .choix-langue a:hover { background: rgba(255,255,255,0.18); color: #fff; }
        .choix-langue a.actif { background: #fff; color: #1A1A2E; }
        @media (max-width: 520px) {
            .choix-langue { top: 12px; right: 12px; padding: 4px 5px; }
            .choix-langue a { font-size: 11px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <div class="choix-langue">
        <a href="/langue/fr" class="{{ 'actif' if lang == 'fr' else '' }}">FR</a>
        <a href="/langue/en" class="{{ 'actif' if lang == 'en' else '' }}">EN</a>
        <a href="/langue/es" class="{{ 'actif' if lang == 'es' else '' }}">ES</a>
    </div>

    <div class="fond" id="fond"></div>

    <!-- ÉCRAN 1 : ACCUEIL -->
    <div class="ecran-accueil" id="ecran-accueil">
        <div class="accueil-panel">
            <div class="nom-appli">
                <span class="plateforme">{{ t('log_plateforme') }}</span>
                <span class="sigle">SIDAC</span>
            </div>
            <p class="accueil-slogan">{{ t('log_slogan') }}</p>
            <button class="btn-acceder" id="btn-acceder" onclick="afficherLogin()">{{ t('log_acceder') }}</button>
        </div>
    </div>

    <!-- ÉCRAN 2 : CONNEXION -->
    <div class="ecran-login" id="ecran-login">
        <button class="btn-retour" onclick="retourAccueil()">{{ t('log_retour') }}</button>
        <div class="card">
            <img src="/static/logo_sidac.svg" class="card-logo" alt="SIDAC">
            <div class="card-titre">BEAC</div>
            <div class="card-sous-titre">{{ t('log_banque') }}</div>

            <div class="onglets-role" style="display:none">
            </div>

            {% if erreur %}
            <div class="erreur">{{ erreur }}</div>
            {% endif %}
            {% if succes %}
            <div class="succes">{{ succes }}</div>
            {% endif %}

            <form method="POST" style="width:100%" autocomplete="off">
                <div class="form-group">
                    <input type="email" name="email" autocomplete="off"
                           placeholder="{{ t('log_email') }}" required>
                </div>
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" name="mdp" id="mdp" autocomplete="new-password"
                               placeholder="{{ t('log_mdp') }}" required>
                        <svg class="toggle-mdp"
                             onmousedown="voirMdp('mdp', true)"
                             onmouseup="voirMdp('mdp', false)"
                             onmouseleave="voirMdp('mdp', false)"
                             viewBox="0 0 24 24" fill="none" stroke="#1A1A2E" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </div>
                </div>
                <button class="btn" type="submit">{{ t('log_btn') }}</button>
            </form>

            <div id="liens-agent" {% if role_actif == 'admin' %}style="display:none"{% endif %}>
                <div class="links mdp-oublie">
                    <a href="#" onclick="alert({{ t('log_oublie_msg')|tojson }}); return false;">{{ t('log_oublie') }}</a>
                </div>

                <div class="links">
                    <p style="opacity:0.7; font-size:12px;">{{ t('log_comptes') }}</p>
                </div>
            </div>
        </div>
    </div>

<script>
function afficherLogin() {
    document.getElementById('fond').classList.add('flou');
    document.getElementById('ecran-accueil').classList.add('cache');
    document.getElementById('ecran-login').classList.add('visible');
}

function retourAccueil() {
    document.getElementById('fond').classList.remove('flou');
    document.getElementById('ecran-login').classList.remove('visible');
    document.getElementById('ecran-accueil').classList.remove('cache');
}

function voirMdp(id, visible) {
    document.getElementById(id).type = visible ? 'text' : 'password';
}

function choisirRole(role) {
    // Les onglets ont été retirés : la plateforme reconnaît le profil
    // enregistré sur le compte, l'utilisateur n'a plus à le déclarer.
    document.getElementById('liens-agent').style.display = role === 'admin' ? 'none' : 'block';
    masquerMessages();
}

function masquerMessages() {
    document.querySelectorAll('.erreur, .succes').forEach(m => m.style.display = 'none');
}

document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var accueil = document.getElementById('ecran-accueil');
    if (!accueil.classList.contains('cache')) {
        // Écran d'accueil : Entrée ouvre la connexion
        afficherLogin();
    } else {
        // Écran de connexion : Entrée soumet le formulaire quel que soit le focus
        // (corrige le cas où le focus est resté sur l'onglet Administrateur)
        var form = document.querySelector('.ecran-login form');
        if (form) {
            e.preventDefault();
            if (form.requestSubmit) form.requestSubmit();
            else form.submit();
        }
    }
});

setTimeout(masquerMessages, 5000);

document.querySelectorAll('input').forEach(champ => {
    champ.addEventListener('input', masquerMessages);
});

{% if erreur or succes %}
afficherLogin();
{% endif %}
</script>

</body>
</html>
